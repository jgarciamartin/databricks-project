name: Deploy and run on databricks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-on:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI (modern)
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks version

      - name: Normalize env (host/token)
        run: |
          # Remove trailing slash from host and CR/LF from token
          echo "DATABRICKS_HOST=${DATABRICKS_HOST%/}" >> $GITHUB_ENV
          echo "DATABRICKS_TOKEN=$(printf '%s' "$DATABRICKS_TOKEN" | tr -d '\r\n')" >> $GITHUB_ENV

      - name: Smoke test Databricks auth
        run: |
          databricks current-user me
          databricks fs ls dbfs:/

      - name: Upload all .py files in repo root
        run: |
          databricks fs mkdirs dbfs:/Volumes/adbs/default/dbfs/scripts
          for f in ./*.py; do
            [ -f "$f" ] || continue
            databricks fs cp "$f" "dbfs:/Volumes/adbs/default/dbfs/scripts/$(basename "$f")" --overwrite
          done

      - name: List DBFS target (debug)
        run: |
          databricks fs ls dbfs:/Volumes/adbs/default/dbfs/scripts/
