name: Deploy and run on databricks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-on:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI (legacy)
        run: |
          pip install --upgrade pip
          pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host=${DATABRICKS_HOST}
          token=${DATABRICKS_TOKEN}
          EOF
          databricks --version
          ls -la /home/runner/.databrickscfg || echo "File not found"
          
      - name: Upload all .py files in repo root
        run: |
          databricks fs mkdirs dbfs:/FileStore/scripts
          for f in ./*.py; do
            [ -f "$f" ] || continue
            databricks fs cp "$f" "dbfs:/FileStore/scripts/$(basename "$f")" --overwrite
          done

      - name: List DBFS target (debug)
        run: |
          databricks fs ls dbfs:/FileStore/scripts/
